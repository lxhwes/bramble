# Prerequisites (maintainer must complete before first deploy):
#
# 1. Create a Cloudflare Pages project named "bramble" in the dashboard.
#
# 2. Create KV namespaces and update wrangler.toml:
#      wrangler kv namespace create VOTES
#      wrangler kv namespace create VOTES --preview
#    Replace the placeholder IDs in wrangler.toml with the real namespace IDs.
#
# 3. Add GitHub Actions secrets to this repository:
#      CLOUDFLARE_API_TOKEN  — API token with Pages:Edit permission
#      CLOUDFLARE_ACCOUNT_ID — your Cloudflare account ID
#
# 4. CNAME setup (bramble.<yourdomain>) is a separate manual step in the
#    Cloudflare dashboard — not automated here.

name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.3

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm check

      - run: pnpm test

      - run: pnpm build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name=bramble --branch=main --commit-dirty=true

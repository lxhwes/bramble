version: 2

# Minor and patch bumps are grouped into a single PR per ecosystem so a solo
# maintainer gets one review, not fifteen. Majors stay separate — those are the
# ones that need reading.
#
# Node major bumps are deliberately ignored, so they will never arrive as a PR
# and someone has to do them by hand — see the docker section below for why.
# The Dockerfile pins node:24-bookworm-slim in two stages, and better-sqlite3's
# compiled binary is only ABI-compatible because both stages match, so the bump
# is a two-line edit that the CI smoke test then has to prove out.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: build
      prefix-development: chore

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    # Base-image majors are a deliberate decision for an image self-hosters are
    # told to pin, so they are not taken from a bot. Odd-numbered Node releases
    # are never LTS at all; node 25 also broke the build outright by dropping
    # the bundled corepack the builder uses to install pnpm.
    #
    # This deliberately blocks LTS majors too. An earlier attempt allowed them
    # by listing the odd majors as `versions: ["25.x", ...]`, which silently
    # does nothing: the Docker tag is `25-bookworm-slim`, and the suffix stops
    # it matching a semver range. `update-types` is the mechanism that works
    # here, and it cannot tell an LTS line from a non-LTS one.
    #
    # Nothing is lost by doing the jump by hand -- 22 -> 24 was done that way,
    # and the CI smoke test is what proved the recompiled better-sqlite3 binary
    # still worked. Note that `24-bookworm-slim` floats across 24.x, so patch
    # and minor updates keep arriving via the base image itself.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

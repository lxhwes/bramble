name = "bramble"
compatibility_date = "2026-05-03"
compatibility_flags = ["nodejs_als"]
pages_build_output_dir = ".svelte-kit/cloudflare"

# Cron schedule for session pruning is configured in the Cloudflare dashboard
# under Settings → Functions → Cron Triggers (intended schedule: "0 4 * * *",
# 90-day retention window).  Pages projects do not accept [triggers] in
# wrangler.toml — wrangler will reject `pages deploy` if it is present.
# The scheduled() handler is appended to _worker.js by scripts/patch-worker.ts.

# KV namespace for session metadata and votes.
# `preview_id` is used by `wrangler pages dev` for local development.
[[kv_namespaces]]
binding = "VOTES"
id = "bfb9d2ff18b14322b8a4e8cc4929c389"
preview_id = "ccd8f64b574a4a61b3d4bead2e47af67"

# D1 database for structured vote storage (Phase 1.5 migration).
# `preview_database_id` is used by `wrangler pages dev` for local development.
# Future migrations land in migrations/ and apply via `wrangler d1 migrations apply`.
[[d1_databases]]
binding = "DB"
database_name = "bramble"
database_id = "d041224d-dee8-4bdc-b33d-b813d18c52cf"
preview_database_id = "216a9690-9765-4596-a314-120d7e933da8"
migrations_dir = "migrations"
